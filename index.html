<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f1ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Rutinim" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>Rutinim</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root{--bg:#fbf9ff;--card:#fff;--ink:#241b2f;--muted:#776b83;--line:#eadff2;--brand:#7f5af0;--brand2:#aa8df5;--good:#2eaa71;--bad:#dd5a6f;--warn:#e4a62a;--shadow:0 12px 35px rgba(66,43,95,.10)}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#faf6ff,#fff 42%);color:var(--ink)}
    button,input,textarea,select{font:inherit} button{cursor:pointer}
    .app{max-width:1180px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:10;background:rgba(251,249,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:18px 18px 10px}
    .brand{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand h1{margin:0;font-size:28px}.subtitle{color:var(--muted);font-size:13px;margin-top:3px}.streak{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 13px;box-shadow:var(--shadow);font-weight:700;white-space:nowrap}
    nav{display:flex;gap:8px;overflow:auto;padding:14px 0 2px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}.navbtn{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:999px;color:var(--muted);white-space:nowrap}.navbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
    main{padding:18px}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{grid-column:span 4;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}.wide{grid-column:span 8}.full{grid-column:1/-1}.half{grid-column:span 6}
    h2,h3{margin:0 0 12px}.sectionHead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.muted{color:var(--muted)}
    .progress{height:10px;background:#eee8f5;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:999px}.metric{font-size:34px;font-weight:800}.small{font-size:12px}.tag{display:inline-flex;padding:6px 9px;border-radius:999px;background:#f2ecfa;color:#665b74;font-size:12px}
    .checklist{display:grid;gap:9px}.check{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:15px;padding:11px 12px}.check label{display:flex;gap:10px;align-items:center}.check input{width:20px;height:20px;accent-color:var(--brand)}
    .btn{border:0;border-radius:14px;padding:11px 14px;background:var(--brand);color:white;font-weight:700}.btn.secondary{background:#f2ecfa;color:#574867}.btn.good{background:var(--good)}.btn.bad{background:var(--bad)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btnrow{display:flex;gap:8px;flex-wrap:wrap}
    .form{display:grid;gap:10px}.form.two{grid-template-columns:1fr 1fr}.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.form textarea{min-height:90px;resize:vertical}.form label{font-size:13px;color:var(--muted)}
    .timer{text-align:center}.clock{font-variant-numeric:tabular-nums;font-size:52px;font-weight:800;letter-spacing:-2px;margin:14px 0}.timerBtns{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
    .bookshelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}.book{background:linear-gradient(160deg,#6c4ccf,#a98af2);color:white;border-radius:18px;padding:15px;min-height:210px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 24px rgba(82,57,130,.22)}.book h4{margin:0 0 5px;font-size:18px}.book .progress{background:rgba(255,255,255,.25)}.book .progress span{background:#fff}.book small{opacity:.9}.bookActions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.bookActions button{font-size:12px;border:0;border-radius:10px;padding:7px 9px}
    .flashWrap{display:grid;place-items:center;min-height:340px}.flash{width:min(430px,100%);height:250px;perspective:1000px}.flashInner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}.flash.flipped .flashInner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:28px;border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;padding:30px;text-align:center;background:#fff}.face.back{transform:rotateY(180deg);background:#f3edff}.word{font-size:40px;font-weight:850}.wordHint{color:var(--muted);margin-top:8px}
    .wordlist{display:grid;gap:8px;max-height:360px;overflow:auto}.worditem{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;border:1px solid var(--line);border-radius:14px;padding:10px;align-items:center}.pill{width:12px;height:12px;border-radius:50%}.pill.green{background:var(--good)}.pill.red{background:var(--bad)}.pill.gray{background:#bbb}
    .hobbyGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.hobby{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}.hobby img{width:100%;height:140px;object-fit:cover}.hobbyBody{padding:13px}.hobby h4{margin:0 0 6px}.hobby p{white-space:pre-wrap}.placeholder{height:140px;display:grid;place-items:center;font-size:52px;background:#f4eff9}
    .exercise{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:8px}.exercise b{display:block}.barrow{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;margin:9px 0}.bar{height:12px;background:#eee8f5;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;border-radius:99px;background:var(--brand)}
    .week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{border:1px solid var(--line);border-radius:16px;padding:10px;min-height:120px}.day strong{font-size:13px}.day .dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.dot{width:10px;height:10px;border-radius:50%;background:#ddd}.dot.done{background:var(--good)}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2235;color:white;padding:11px 15px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:20}.toast.show{opacity:1}
    dialog{border:0;border-radius:22px;padding:0;box-shadow:0 20px 70px rgba(0,0,0,.25);max-width:520px;width:calc(100% - 30px)}dialog::backdrop{background:rgba(20,15,25,.35)}.modal{padding:20px}
    @media(max-width:850px){.card,.wide,.half{grid-column:1/-1}.grid{gap:12px}.top{padding:14px 14px 8px}main{padding:14px}.week{grid-template-columns:repeat(2,1fr)}.clock{font-size:46px}.brand h1{font-size:24px}.streak{font-size:13px}}
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div><h1>🌷 Rutinim</h1><div class="subtitle">Kendine ayırdığın zamanın küçük ama düzenli kaydı.</div></div><div class="streak">🔥 <span id="streak">0</span> gün</div></div>
    <nav id="nav"></nav>
  </header>
  <main>
    <section id="dashboard" class="view active"></section>
    <section id="prayer" class="view"></section>
    <section id="books" class="view"></section>
    <section id="english" class="view"></section>
    <section id="pilates" class="view"></section>
    <section id="hobbies" class="view"></section>
    <section id="reports" class="view"></section>
  </main>
</div>
<div id="toast" class="toast"></div>
<dialog id="bookDialog"><div class="modal"><div class="sectionHead"><h3>Kitap ekle</h3><button class="btn ghost" onclick="bookDialog.close()">Kapat</button></div><form id="bookForm" class="form"><input name="title" required placeholder="Kitap adı"><input name="author" required placeholder="Yazar"><input name="pages" required min="1" type="number" placeholder="Toplam sayfa"><input name="current" min="0" type="number" value="0" placeholder="Şu anki sayfa"><button class="btn">Kütüphaneye ekle</button></form></div></dialog>
<dialog id="hobbyDialog"><div class="modal"><div class="sectionHead"><h3>Hobi ekle</h3><button class="btn ghost" onclick="hobbyDialog.close()">Kapat</button></div><form id="hobbyForm" class="form"><input name="title" required placeholder="Hobi adı"><textarea name="notes" placeholder="Bu hobiyle ilgili notların, fikirlerin..."></textarea><label>İstersen fotoğraf yükle</label><input name="image" type="file" accept="image/*"><button class="btn">Hobi ekle</button></form></div></dialog>
<script>
const DBKEY='rutinim_v1';
const today=()=>new Date().toISOString().slice(0,10);
const base={
  prayer:{}, habits:{}, books:[], words:[], hobbies:[], pilates:{}, sessions:[], settings:{dailyWordTarget:10}
};
let db=Object.assign({},base,JSON.parse(localStorage.getItem(DBKEY)||'{}'));
['prayer','habits','pilates'].forEach(k=>db[k]=db[k]||{});['books','words','hobbies','sessions'].forEach(k=>db[k]=db[k]||[]);
const save=()=>{localStorage.setItem(DBKEY,JSON.stringify(db)); renderAll();};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const toast=(m)=>{let t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)};
const navItems=[['dashboard','Bugün'],['prayer','Namaz'],['books','Kütüphane'],['english','İngilizce'],['pilates','Pilates'],['hobbies','Hobiler'],['reports','Raporlar']];
nav.innerHTML=navItems.map(([id,l],i)=>`<button class="navbtn ${i?'':'active'}" data-id="${id}">${l}</button>`).join('');
nav.onclick=e=>{let b=e.target.closest('button');if(!b)return;document.querySelectorAll('.navbtn,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.id).classList.add('active');};
function getTodayObj(obj){return obj[today()]||{};}
function toggleHabit(k,v){db.habits[today()]={...getTodayObj(db.habits),[k]:v};save();}
function togglePrayer(k,v){db.prayer[today()]={...getTodayObj(db.prayer),[k]:v};save();}
function minutesToday(type){return db.sessions.filter(s=>s.date===today()&&s.type===type).reduce((a,s)=>a+s.minutes,0)}
function dayScore(date=today()){
 const p=db.prayer[date]||{},h=db.habits[date]||{}; const prayerDone=['Sabah','Öğle','İkindi','Akşam','Yatsı'].filter(x=>p[x]).length;
 const basics=[prayerDone>=5,h.pilates,h.reading,h.english,h.hobby].filter(Boolean).length; return basics;
}
function calcStreak(){let n=0,d=new Date();for(let i=0;i<365;i++){let k=d.toISOString().slice(0,10);if(dayScore(k)>=3)n++;else if(i>0)break;d.setDate(d.getDate()-1)}return n}
function renderDashboard(){const p=getTodayObj(db.prayer),h=getTodayObj(db.habits);const prayers=['Sabah','Öğle','İkindi','Akşam','Yatsı'];let pd=prayers.filter(x=>p[x]).length;let learned=db.words.filter(w=>w.status==='learned').length;let current=db.books.filter(b=>b.current<b.pages).length;
 dashboard.innerHTML=`<div class="grid">
 <div class="card"><div class="muted">Bugünkü tamamlanma</div><div class="metric">${dayScore()}/5</div><div class="progress"><span style="width:${dayScore()*20}%"></span></div></div>
 <div class="card"><div class="muted">Namaz</div><div class="metric">${pd}/5</div><div class="progress"><span style="width:${pd*20}%"></span></div></div>
 <div class="card"><div class="muted">Ezberlenen kelime</div><div class="metric">${learned}</div><span class="tag">Toplam ${db.words.length} kart</span></div>
 <div class="card wide"><div class="sectionHead"><h3>Bugünün rutini</h3><span class="tag">Minimum gün de sayılır ✨</span></div><div class="checklist">
 ${[['pilates','🧘 Pilates'],['reading','📚 Kitap okuma'],['english','🇬🇧 İngilizce'],['hobby','🎨 Hobi zamanı']].map(([k,l])=>`<div class="check"><label><input type="checkbox" ${h[k]?'checked':''} onchange="toggleHabit('${k}',this.checked)">${l}</label><span class="muted small">${h[k]?'Tamamlandı':'Bekliyor'}</span></div>`).join('')}
 </div></div>
 <div class="card"><h3>Odak süreleri</h3><p>📚 Okuma: <b>${minutesToday('reading')} dk</b></p><p>🇬🇧 İngilizce: <b>${minutesToday('english')} dk</b></p><p>🧘 Pilates: <b>${minutesToday('pilates')} dk</b></p><p>🎨 Hobi: <b>${minutesToday('hobby')} dk</b></p></div>
 <div class="card full"><div class="sectionHead"><h3>Kütüphanem</h3><span class="muted">${current} aktif kitap</span></div><div class="bookshelf">${db.books.slice(0,5).map(bookCard).join('')||'<div class="muted">Henüz kitap eklemedin.</div>'}</div></div>
 </div>`;
}
function renderPrayer(){const p=getTodayObj(db.prayer);const prayers=['Sabah','Öğle','İkindi','Akşam','Yatsı'];prayer.innerHTML=`<div class="grid"><div class="card half"><h2>🕌 Namaz Takibi</h2><p class="muted">Bugün kıldıklarını işaretle.</p><div class="checklist">${prayers.map(x=>`<div class="check"><label><input type="checkbox" ${p[x]?'checked':''} onchange="togglePrayer('${x}',this.checked)">${x}</label>${p[x]?'<span class="tag">✓</span>':''}</div>`).join('')}</div></div><div class="card half"><h3>Haftalık görünüm</h3>${weekPrayer()}</div></div>`}
function weekPrayer(){let ds=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let k=d.toISOString().slice(0,10),p=db.prayer[k]||{},n=['Sabah','Öğle','İkindi','Akşam','Yatsı'].filter(x=>p[x]).length;ds.push(`<div class="day"><strong>${d.toLocaleDateString('tr-TR',{weekday:'short'})}</strong><div class="metric" style="font-size:24px">${n}/5</div><div class="dots">${[1,2,3,4,5].map(j=>`<span class="dot ${j<=n?'done':''}"></span>`).join('')}</div></div>`)}return `<div class="week">${ds.join('')}</div>`}
function bookCard(b){let pct=Math.min(100,Math.round((b.current/b.pages)*100)||0);return `<div class="book"><div><h4>${esc(b.title)}</h4><small>${esc(b.author)}</small></div><div><b>${pct}%</b><div class="progress"><span style="width:${pct}%"></span></div><small>${b.current}/${b.pages} sayfa</small><div class="bookActions"><button onclick="focusBook('${b.id}')">Odaklan</button><button onclick="advanceBook('${b.id}')">Sayfa +</button><button onclick="editBook('${b.id}')">Güncelle</button></div></div></div>`}
function renderBooks(){books.innerHTML=`<div class="grid"><div class="card full"><div class="sectionHead"><div><h2>📚 Kütüphanem</h2><div class="muted">Kitaplarını raflarda tut, ilerlemeni otomatik hesapla.</div></div><button class="btn" onclick="bookDialog.showModal()">+ Kitap ekle</button></div><div class="bookshelf">${db.books.map(bookCard).join('')||'<div class="muted">İlk kitabını ekleyebilirsin.</div>'}</div></div><div class="card half">${timerBox('reading','Okuma odaklanma')}</div><div class="card half"><h3>Okuma özeti</h3><p>Bugün: <b>${minutesToday('reading')} dk</b></p><p>Toplam kitap: <b>${db.books.length}</b></p><p>Tamamlanan: <b>${db.books.filter(b=>b.current>=b.pages).length}</b></p></div></div>`}
bookForm.onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),pages=+f.get('pages'),current=+f.get('current')||0;db.books.push({id:crypto.randomUUID(),title:f.get('title'),author:f.get('author'),pages,current:Math.min(current,pages)});e.target.reset();bookDialog.close();save();toast('Kitap rafına eklendi 📚')}
function advanceBook(id){let b=db.books.find(x=>x.id===id);let n=prompt('Kaç sayfa okudun?','10');if(!n)return;b.current=Math.min(b.pages,b.current+(+n||0));toggleHabit('reading',true);save()}
function editBook(id){let b=db.books.find(x=>x.id===id);let n=prompt('Şu an kaçıncı sayfadasın?',b.current);if(n===null)return;b.current=Math.max(0,Math.min(b.pages,+n||0));save()}
function focusBook(id){localStorage.setItem('focusBookId',id);document.querySelector('[data-id="books"]').click();setTimeout(()=>toast('Okuma zamanlayıcısını başlatabilirsin'),100)}
let timer={type:null,seconds:0,running:false,int:null};
function timerBox(type,title){return `<div class="timer"><h3>${title}</h3><div class="clock" id="clock-${type}">00:00</div><div class="timerBtns"><button class="btn" onclick="startTimer('${type}')">Başlat</button><button class="btn secondary" onclick="pauseTimer()">Duraklat</button><button class="btn ghost" onclick="finishTimer('${type}')">Bitir & Kaydet</button></div><div class="small muted" style="margin-top:10px">Süre bitince ilgili günlük hedef de otomatik tamamlanır.</div></div>`}
function startTimer(type){if(timer.running&&timer.type!==type)return toast('Önce açık zamanlayıcıyı bitir.');timer.type=type;timer.running=true;clearInterval(timer.int);timer.int=setInterval(()=>{timer.seconds++;updateClocks()},1000);updateClocks()}
function pauseTimer(){timer.running=false;clearInterval(timer.int)}
function finishTimer(type){if(timer.type!==type&&timer.seconds===0)return;pauseTimer();let mins=Math.max(1,Math.round(timer.seconds/60));db.sessions.push({id:crypto.randomUUID(),type,date:today(),minutes:mins,createdAt:Date.now()});if(type==='reading')db.habits[today()]={...getTodayObj(db.habits),reading:true};if(type==='english')db.habits[today()]={...getTodayObj(db.habits),english:true};if(type==='pilates')db.habits[today()]={...getTodayObj(db.habits),pilates:true};if(type==='hobby')db.habits[today()]={...getTodayObj(db.habits),hobby:true};timer={type:null,seconds:0,running:false,int:null};save();toast(`${mins} dk kaydedildi ⏱️`)}
function updateClocks(){document.querySelectorAll('[id^="clock-"]').forEach(el=>{let s=timer.seconds,m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');if(el.id==='clock-'+timer.type)el.textContent=`${m}:${ss}`})}
function addWord(e){e.preventDefault();let f=new FormData(e.target);db.words.push({id:crypto.randomUUID(),en:f.get('en').trim(),tr:f.get('tr').trim(),example:f.get('example').trim(),status:'new',right:0,wrong:0});e.target.reset();save();toast('Kelime kartı eklendi')}
let quiz={id:null,dir:'en-tr',flipped:false};
function nextCard(){let pool=db.words.length?db.words:[];if(!pool.length){quiz.id=null;return renderEnglish()}let weighted=pool.filter(w=>w.status!=='learned');if(!weighted.length)weighted=pool;quiz.id=weighted[Math.floor(Math.random()*weighted.length)].id;quiz.dir=Math.random()>.5?'en-tr':'tr-en';quiz.flipped=false;renderEnglish()}
function rateCard(ok){let w=db.words.find(x=>x.id===quiz.id);if(!w)return; if(ok){w.right++;w.status=w.right>=2&&w.right>w.wrong?'learned':'learning'}else{w.wrong++;w.status='learning'};save();setTimeout(nextCard,80)}
function renderEnglish(){let w=db.words.find(x=>x.id===quiz.id);let learned=db.words.filter(x=>x.status==='learned').length;english.innerHTML=`<div class="grid"><div class="card half"><h2>🇬🇧 Kelime Kutusu</h2><form class="form" onsubmit="addWord(event)"><div class="form two"><input name="en" required placeholder="English"><input name="tr" required placeholder="Türkçesi"></div><textarea name="example" placeholder="Örnek cümle / kelimenin geçtiği bağlam"></textarea><button class="btn">+ Kelime ekle</button></form><p class="muted small">Yeşil = ezberledim, kırmızı = tekrar gerekli.</p></div><div class="card half"><h3>Durum</h3><div class="metric">${learned}/${db.words.length}</div><div class="progress"><span style="width:${db.words.length?learned/db.words.length*100:0}%"></span></div><p>Bugünkü hedef: <b>${Math.min(db.words.length,db.settings.dailyWordTarget)} kart tekrar</b></p></div>
<div class="card full"><div class="sectionHead"><h3>Rastgele kart</h3><button class="btn secondary" onclick="nextCard()">Rastgele kelime sor</button></div>${w?`<div class="flashWrap"><div class="flash ${quiz.flipped?'flipped':''}" onclick="quiz.flipped=!quiz.flipped;renderEnglish()"><div class="flashInner"><div class="face front"><div><div class="word">${esc(quiz.dir==='en-tr'?w.en:w.tr)}</div><div class="wordHint">Kartı çevir</div></div></div><div class="face back"><div><div class="word">${esc(quiz.dir==='en-tr'?w.tr:w.en)}</div><div class="wordHint">${esc(w.example||'')}</div></div></div></div></div><div class="btnrow" style="justify-content:center"><button class="btn bad" onclick="rateCard(false)">← Ezberlemedim</button><button class="btn good" onclick="rateCard(true)">Ezberledim →</button></div></div>`:'<div class="muted">Kelime ekledikten sonra rastgele kart çalışabilirsin.</div>'}</div>
<div class="card half">${timerBox('english','İngilizce odaklanma')}</div><div class="card half"><h3>Kelimelerim</h3><div class="wordlist">${db.words.map(x=>`<div class="worditem"><b>${esc(x.en)}</b><span>${esc(x.tr)}</span><span title="${x.status}" class="pill ${x.status==='learned'?'green':x.status==='learning'?'red':'gray'}"></span></div>`).join('')||'<span class="muted">Henüz kelime yok.</span>'}</div></div></div>`;updateClocks()}
function renderPilates(){const ex=[['Cat-Cow','3 dk','Omurga mobilitesi'],['Glute Bridge','3×12','Kalça ve core'],['Dead Bug','3×10','Core kontrolü'],['Side Leg Lift','2×12','Kalça yan kasları'],['Bird Dog','2×10','Denge ve core'],['Child’s Pose','2 dk','Soğuma / esneme']];pilates.innerHTML=`<div class="grid"><div class="card half"><h2>🧘 Pilates</h2><p class="muted">Günlük hedef: 30 dakika. Ağrıya zorlamadan, kontrollü çalış.</p>${ex.map(x=>`<div class="exercise"><div><b>${x[0]}</b><span class="muted small">${x[2]}</span></div><span class="tag">${x[1]}</span></div>`).join('')}</div><div class="card half">${timerBox('pilates','Pilates zamanlayıcısı')}</div><div class="card full"><h3>Bugün</h3><p>Kaydedilen egzersiz süresi: <b>${minutesToday('pilates')} dk</b></p><div class="progress"><span style="width:${Math.min(100,minutesToday('pilates')/30*100)}%"></span></div></div></div>`;updateClocks()}
function renderHobbies(){hobbies.innerHTML=`<div class="grid"><div class="card full"><div class="sectionHead"><div><h2>🎨 Hobilerim</h2><div class="muted">Fikir, not, fotoğraf ve zaman takibi.</div></div><button class="btn" onclick="hobbyDialog.showModal()">+ Hobi ekle</button></div><div class="hobbyGrid">${db.hobbies.map(h=>`<div class="hobby">${h.image?`<img src="${h.image}" alt="">`:'<div class="placeholder">✨</div>'}<div class="hobbyBody"><h4>${esc(h.title)}</h4><p class="muted">${esc(h.notes||'')}</p><div class="btnrow"><button class="btn secondary" onclick="startHobby('${h.id}')">Zaman ayır</button><button class="btn ghost" onclick="deleteHobby('${h.id}')">Sil</button></div></div></div>`).join('')||'<div class="muted">Defter süsleme, çizim, fotoğraf, tarif deneme… İlk hobini ekle.</div>'}</div></div><div class="card half">${timerBox('hobby','Hobi odaklanma')}</div><div class="card half"><h3>Bugünkü hobi zamanı</h3><div class="metric">${minutesToday('hobby')} dk</div><p class="muted">Zamanlayıcıyı bitirdiğinde günlük “hobi” hedefi otomatik işaretlenir.</p></div></div>`;updateClocks()}
hobbyForm.onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),file=f.get('image'),image='';if(file&&file.size){image=await new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file)})}db.hobbies.push({id:crypto.randomUUID(),title:f.get('title'),notes:f.get('notes'),image});e.target.reset();hobbyDialog.close();save()}
function startHobby(id){document.querySelector('[data-id="hobbies"]').click();startTimer('hobby');toast('Hobi süresi başladı 🎨')}
function deleteHobby(id){if(confirm('Bu hobiyi silmek istiyor musun?')){db.hobbies=db.hobbies.filter(x=>x.id!==id);save()}}
function renderReports(){let days=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let k=d.toISOString().slice(0,10);days.push({k,label:d.toLocaleDateString('tr-TR',{weekday:'short'}),score:dayScore(k),p:Object.values(db.prayer[k]||{}).filter(Boolean).length})}let max=5;reports.innerHTML=`<div class="grid"><div class="card full"><h2>📊 Haftalık Rapor</h2><p class="muted">Kırmızı baskı kurmak için değil; nerede düzen kurduğunu görmek için.</p>${days.map(d=>`<div class="barrow"><b>${d.label}</b><div class="bar"><span style="width:${d.score/max*100}%"></span></div><b>${d.score}/5</b></div>`).join('')}</div><div class="card half"><h3>Kelime raporu</h3><p>🟢 Ezberledim: <b>${db.words.filter(w=>w.status==='learned').length}</b></p><p>🔴 Çalışıyorum: <b>${db.words.filter(w=>w.status==='learning').length}</b></p><p>⚪ Yeni: <b>${db.words.filter(w=>w.status==='new').length}</b></p></div><div class="card half"><h3>Toplam odak</h3>${['reading','english','pilates','hobby'].map(t=>`<p>${{reading:'📚 Okuma',english:'🇬🇧 İngilizce',pilates:'🧘 Pilates',hobby:'🎨 Hobi'}[t]}: <b>${db.sessions.filter(s=>s.type===t).reduce((a,s)=>a+s.minutes,0)} dk</b></p>`).join('')}</div><div class="card full"><div class="sectionHead"><h3>Verilerim</h3><div class="btnrow"><button class="btn secondary" onclick="exportData()">Yedek indir</button><button class="btn ghost" onclick="document.getElementById('importFile').click()">Yedek yükle</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"></div></div><p class="muted small">Veriler bu cihazın tarayıcısında saklanır. Tarayıcı verilerini silersen yedekten geri yükleyebilirsin.</p></div></div>`}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rutinim-yedek.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();toast('Yedek geri yüklendi')}catch{alert('Geçersiz dosya')}};r.readAsText(f)}
function renderAll(){document.getElementById('streak').textContent=calcStreak();renderDashboard();renderPrayer();renderBooks();renderEnglish();renderPilates();renderHobbies();renderReports();updateClocks()}
renderAll();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
